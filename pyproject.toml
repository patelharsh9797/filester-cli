[project]
name = "filester-cli"
version = "0.2.1"
description = "A CLI + watch-daemon for the Filester (filester.me) storage API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Harsh" }]
keywords = ["filester", "cli", "upload", "ctbrec", "storage"]
dependencies = [
    "requests>=2.31",
    "requests-toolbelt>=1.0.0",
    "rich>=13.7",
    "rich-argparse>=1.5",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/filester-cli"
Issues = "https://github.com/YOUR_USERNAME/filester-cli/issues"

[project.scripts]
filester = "filester.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filester"]
